services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      ALLOWED_GITHUB_USERS: ${ALLOWED_GITHUB_USERS:-}
      ALLOWED_GITHUB_ORG: ${ALLOWED_GITHUB_ORG:-}
      ADMIN_GITHUB_USERS: ${ADMIN_GITHUB_USERS}
      AWS_REGION: ${AWS_REGION}
      FERRY_PREFIX: ${FERRY_PREFIX:-ferry}
      KMS_KEY_ID: ${KMS_KEY_ID:-}
      PROTECTED_ENVS: ${PROTECTED_ENVS:-production}
      TRUST_PROXY: "true"
      # Only needed when not running with an attached IAM role:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ferry-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  ferry-data:
  caddy-data:
  caddy-config:
